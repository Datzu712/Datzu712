name: Render README cards

on:
  # every six hours: the uptime ticks daily, the GitHub numbers whenever
  schedule:
    - cron: "17 */6 * * *"
  # and whenever what the cards say changes
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # no dependencies: the runner's own Node is enough
      - name: Render
        run: node scripts/render.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # only when a card actually changed, so a quiet day is one commit at most
      - name: Commit
        run: |
          if git diff --quiet -- assets; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh the README cards"
          git push
