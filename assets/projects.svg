<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 997 298" width="997" height="298" role="img" aria-label="Projects. ngdose (production): strangling a 13-year-old CakePHP app, live. radiation-group (production): a certificate portal, and an AI that can't write. hix (public draft, open source): a FHIR R5 spec for exchanging clinical documents. hix-hie (first release): the services that run HIX. nodecord (released, open source): enterprise DI for Discord bots. built it anyway. fidechat (wip, open source): the same chat app, built three times. mind-body (paused, open source): a gym app whose AI coach reads your routines" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace" font-size="16">
<style>
  text { white-space: pre; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .blink { animation: none; }
  }
  .typing { transform: scaleX(0); transform-origin: 344.8px 0; animation: typing 0.67s steps(15) 3s backwards; }
  @keyframes typing { from { transform: scaleX(1); } }
  .caret { opacity: 0; animation: caret-on 3.92s steps(1), caret-go 0.67s steps(15) 3s both; }
  @keyframes caret-on { from, to { opacity: 1; } }
  @keyframes caret-go { to { transform: translateX(144px); } }
  .printing { transform: scaleY(0); transform-origin: 0 270px; animation: printing 0.3s steps(10) 3.92s backwards; }
  @keyframes printing { from { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) {
    .typing, .caret, .printing { animation: none; }
  }
  .live { animation: live 2.6s ease-in-out infinite; }
  @keyframes live { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) {
    .live { animation: none; }
  }
  .spin circle { animation: spin 0.9s steps(1) infinite; }
  @keyframes spin { 0% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .spin circle { animation: none; }
  }
</style>
